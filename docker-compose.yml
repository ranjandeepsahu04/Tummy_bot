version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tummy_bot_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tummy_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tummy_bot_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/tummy_bot?schema=public
      JWT_SECRET: super-secret-jwt-key-production
      JWT_REFRESH_SECRET: super-secret-refresh-key-production
      WHATSAPP_PROVIDER: meta
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tummy_bot_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  pgdata:
